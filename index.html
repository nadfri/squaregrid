<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SquareGrid · Grille de factorisation</title>
    <script type="module" src="/src/grid.ts"></script>
  </head>

  <body>
    <canvas id="canvas" aria-label="Grille de nombres"></canvas>

    <header class="toolbar glass">
      <span class="brand">SquareGrid</span>

      <div class="field">
        <label for="init">Init</label>
        <div class="stepper">
          <button type="button" class="btn btn-icon" id="decrement" aria-label="Init − 1">−</button>
          <input type="text" inputmode="numeric" id="init" value="1" autocomplete="off" />
          <button type="button" class="btn btn-icon" id="increment" aria-label="Init + 1">+</button>
        </div>
      </div>

      <div class="field">
        <span class="label">p × q</span>
        <div class="pq">
          <input
            type="text"
            inputmode="numeric"
            placeholder="p"
            id="p"
            aria-label="p"
            autocomplete="off"
          />
          ×
          <input
            type="text"
            inputmode="numeric"
            placeholder="q"
            id="q"
            aria-label="q"
            autocomplete="off"
          />
          =
          <output id="pq" class="num" for="p q"></output>
        </div>
      </div>

      <div class="field">
        <label for="n">N</label>
        <input type="text" inputmode="numeric" placeholder="N" id="n" autocomplete="off" />
      </div>

      <div class="field">
        <label for="moduli">Modulo m</label>
        <input
          type="text"
          id="moduli"
          placeholder="ex. 8, 3, 5"
          title="Grise les cases qui ne peuvent pas être un carré modulo m (plusieurs m séparés par des virgules)"
          autocomplete="off"
        />
      </div>

      <div class="toolbar-actions">
        <button
          type="button"
          class="btn btn-primary"
          id="fermat"
          title="N au sommet puis des lignes de 1, 3, 5… : la ligne X se termine sur N + X²"
        >
          Pyramide de Fermat (N)
        </button>
        <button
          type="button"
          class="btn"
          id="pyramide"
          title="Pyramide de N nombres (max 1 000 000)"
        >
          Pyramide (N)
        </button>
        <button type="button" class="btn" id="focusN" title="Centrer la vue sur N">Voir N</button>
        <button type="button" class="btn" id="reset">Reset</button>
        <a class="btn" href="square.html">Factoriser →</a>
      </div>
    </header>

    <aside class="legend glass" aria-label="Légende">
      <span><i class="swatch" style="background: var(--cell-prime)"></i>Premier</span>
      <span><i class="swatch" style="background: var(--cell-square)"></i>Carré</span>
      <span><i class="swatch" style="background: var(--cell-target)"></i>N</span>
      <span><i class="swatch" style="background: var(--cell-mark)"></i>p, q, pq</span>
      <span><i class="swatch" style="background: var(--cell-other)"></i>Composé</span>
      <span><i class="swatch swatch-dim"></i>Pas un carré mod m</span>
    </aside>

    <aside class="fermat glass" id="fermatPanel" aria-live="polite" hidden>
      <h2>N + X² = Y²</h2>
      <div id="fermatBody"></div>
    </aside>

    <aside class="prefix glass" id="prefix" hidden>
      Préfixe commun
      <span class="num" id="prefixValue"></span>
    </aside>

    <div class="hud glass">
      <div class="hud-stats">
        <span>Lignes <b id="rowCounter">0</b></span>
        <span>Cellules <b id="cellCounter">0</b></span>
        <span class="status" id="status" aria-live="polite"></span>
      </div>
      <div class="segmented" role="group" aria-label="Outil">
        <button type="button" id="modeDraw" aria-pressed="true" title="Dessiner (D)">Dessin</button>
        <button
          type="button"
          id="modePan"
          aria-pressed="false"
          title="Déplacer (H ou Espace maintenu)"
        >
          Déplacer
        </button>
      </div>
      <button type="button" class="btn btn-icon" id="zoomOut" aria-label="Zoom arrière">−</button>
      <span id="zoomLevel">100%</span>
      <button type="button" class="btn btn-icon" id="zoomIn" aria-label="Zoom avant">+</button>
      <button type="button" class="btn" id="fit" title="Ajuster à la vue (F)">Ajuster</button>
    </div>

    <div class="tooltip glass" id="tooltip" role="tooltip" hidden>
      <span class="num" id="tooltipValue"></span>
      <span class="tag"
        ><i class="swatch" id="tooltipSwatch"></i><span id="tooltipTag"></span
      ></span>
      <small id="tooltipPos"></small>
      <small class="num" id="tooltipMod" hidden></small>
    </div>
  </body>
</html>
